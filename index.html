`<section class="wrap sec tight"><div class="tag rv">04 / Our creators</div><h2 class="rv">Already enrolled.<br><em>Meet them.</em></h2><p class="rv" style="max-width:480px">Creators who have enrolled with MXT and Creation League, working across design, code, film, art and music.</p><a class="lnk rv" href="#creators">See our creators ${A}</a></section>`+

 const bars=$$('.cv i');ctl&&ctl.kill();gsap.killTweensOf(bars);gsap.set('.cv',{display:'flex'});
 ctl=gsap.timeline().to(bars,{scaleY:1,transformOrigin:'50% 100%',duration:.34,stagger:.05,ease:'power3.in'}).add(()=>{doRoute(true);anim(cur)}).to(bars,{scaleY:0,transformOrigin:'50% 0%',duration:.55,stagger:.05,ease:'power3.out'},'+=.08').set('.cv',{display:'none'})}
function doRoute(defer){let[id,anc]=location.hash.slice(1).split('/');if(id==='main'){$('main').focus();return}id=({crew:'team','creation-league':'league'})[id]||id;if(!pages.some(p=>p.id===id))id='home';pages.forEach(p=>p.hidden=p.id!==id);$$('.links a').forEach(a=>a.hash==='#'+id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));document.title=(id==='home'?'We build what’s next':NAV.find(x=>x[0]===id)[1])+' — MXT Technologies';nav.classList.remove('open');menu.setAttribute('aria-expanded','false');scrollTo(0,0);cur=id;if(G){if(!defer)anim(id)}else $$('#'+id+' .rv:not(.in)').forEach(e=>io?io.observe(e):e.classList.add('in'));if(anc)go(document.getElementById(anc))}
addEventListener('hashchange',route);route();
menu.onclick=()=>{const o=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(o))};
addEventListener('keydown',e=>{if(e.key==='Escape'){nav.classList.remove('open');menu.setAttribute('aria-expanded','false');$('#tk').classList.remove('open')}});
$$('[data-role]').forEach(b=>b.onclick=()=>{const s=$('select[name=position]');s.value=b.dataset.role;go($('#application-form'));s.focus({preventScroll:true})});
$$('form[data-draft]').forEach(f=>{const out=f.querySelector('.out'),cp=f.querySelector('.cp'),st=f.querySelector('.st');let txt='';
f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;let c='MXT '+f.dataset.draft+' draft\nNot submitted online.\n\n';for(const[k,v]of new FormData(f))if(k!=='website')c+=k+': '+v+'\n\n';txt=c;if(f.dataset.draft==='application'){const b=f.querySelector('button[type=submit]'),L=b.innerHTML;b.disabled=true;b.textContent='Sending…';st.textContent='';const ok=await sendApp(new FormData(f));b.disabled=false;b.innerHTML=L;if(ok){st.textContent='Application sent to the MXT team on Discord. Thank you!';out.classList.remove('on');cp.classList.remove('on');f.reset();return}st.textContent='We couldn’t reach Discord from this page. Your draft is below. Copy it and share it directly with the MXT team.';out.value=c;out.classList.add('on');cp.classList.add('on');return}
try{const u=URL.createObjectURL(new Blob([c],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='MXT-'+f.dataset.draft+'-draft.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(_){}out.value=c;out.classList.add('on');cp.classList.add('on');st.textContent='Draft prepared. If no file downloaded, copy it below and share it directly with the MXT team.'};
cp.onclick=async()=>{try{await navigator.clipboard.writeText(txt);st.textContent='Draft copied.'}catch(_){out.select();st.textContent='Select and copy the draft text above.'}}});
/* tweaks */
const tk=$('#tk');tk.querySelector('button').onclick=e=>{const o=tk.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(o))};
[['#c58bff','Lilac'],['#ff9be8','Orchid'],['#9bb0ff','Periwinkle']].forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.style.background=c[0];b.setAttribute('aria-label',c[1]+' accent');b.setAttribute('aria-pressed',i===0);b.onclick=()=>{document.documentElement.style.setProperty('--accent',c[0]);$$('#sw button').forEach(x=>x.setAttribute('aria-pressed',x===b))};$('#sw').appendChild(b)});
$('#sp').onchange=e=>document.body.classList.toggle('nospot',!e.target.checked);
if(!RM&&matchMedia('(hover:hover)').matches)addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px')},{passive:true});

*,*:before,*:after{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--paper);font:17px/1.65 var(--b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none;cursor:pointer}button,summary,select{cursor:pointer}p{margin:0 0 20px;color:var(--muted);text-wrap:pretty}
h1,h2,h3{font-family:var(--d);margin:0;line-height:1.02;letter-spacing:-.035em;text-wrap:balance;font-weight:600}
h1{font-size:clamp(46px,8vw,124px);letter-spacing:-.05em}h2{font-size:clamp(34px,5vw,72px);margin-bottom:28px}h3{font-size:clamp(22px,2.2vw,30px);letter-spacing:-.02em}
em{font-style:normal;color:var(--accent)}
.wrap{width:min(1240px,100% - 48px);margin-inline:auto}
.ar{width:1em;height:1em;flex:none;transition:transform .25s var(--ease)}a:hover>.ar,button:hover .ar,.card:hover .ar,.row:hover .ar{transform:translate(3px,-3px)}
.tag{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}.tag:before{content:'';width:9px;height:9px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.skip{position:fixed;left:16px;top:-80px;z-index:99;background:var(--brand);padding:12px 18px;border-radius:8px}.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}main:focus{outline:none}
/* header */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in oklab,var(--ink) 80%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}
.brand{display:flex;align-items:center;gap:14px;min-height:44px}.logo{display:block;width:86px;height:44px;background:var(--logo) center/contain no-repeat}.cap{font:600 10px/1.45 var(--b);letter-spacing:.16em;border-left:1px solid var(--line);padding-left:14px}
.links{display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.links a{display:flex;align-items:center;min-height:40px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}.links a:hover{color:var(--paper)}.links a[aria-current=page]{background:var(--brand);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 26px;border-radius:999px;background:var(--brand);border:1px solid color-mix(in oklab,var(--accent) 55%,transparent);color:var(--paper);font:600 14px var(--b);transition:background .2s,transform .2s var(--ease),box-shadow .2s}.btn:hover{background:#7a2bb6;transform:translateY(-2px);box-shadow:0 10px 30px -10px var(--brand)}.btn:active{transform:none}
.btn.ghost{background:transparent;border-color:var(--line)}.btn.ghost:hover{background:var(--panel2);box-shadow:none}
.lnk{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line);transition:color .2s,border-color .2s}.lnk:hover{color:var(--accent);border-color:var(--accent)}
.mt{display:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--paper);font:600 13px var(--b)}
/* hero */
.hero{padding:clamp(40px,6vw,88px) 0 40px}.hg{display:grid;grid-template-columns:1.25fr .9fr;gap:clamp(32px,5vw,72px);align-items:center}
.hero h1{margin:8px 0 30px}.hero p.sub{font-size:19px;max-width:480px}.acts{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-top:36px}
.art{position:relative;aspect-ratio:4/5;background:var(--bg) 66% center/cover;clip-path:polygon(0 0,86% 0,100% 12%,100% 100%,14% 100%,0 88%);border-radius:4px}
.art:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#09070dee 8%,transparent 58%)}
.art .l{position:absolute;inset:26px 40px auto 30px;display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:600;letter-spacing:.16em}
.art .lg{position:absolute;left:30px;right:30px;bottom:64px;height:104px;background:var(--logo) left center/contain no-repeat}.art .f{position:absolute;left:30px;bottom:26px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;border-top:1px solid var(--line);margin-top:56px;padding-top:22px;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.mq{overflow:hidden;border-block:1px solid var(--line);background:var(--panel);padding:22px 0}.mq div{display:flex;width:max-content;animation:mq 28s linear infinite}.mq span{display:flex;align-items:center;gap:36px;padding-right:36px;font:600 clamp(26px,4vw,48px) var(--d);letter-spacing:-.03em;white-space:nowrap}.mq i{width:12px;height:12px;background:var(--brand);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:clamp(64px,9vw,120px) 0}.sec.tight{padding-top:clamp(32px,5vw,56px)}
.mind{display:grid;grid-template-columns:1fr minmax(0,2.3fr);gap:32px}.mind h2{font-size:clamp(40px,6vw,92px);line-height:1}.mind p{max-width:540px;font-size:18px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:36px;min-height:240px;padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));transition:border-color .25s,transform .35s var(--ease)}
.card:after{content:'';position:absolute;width:210px;height:210px;right:-70px;bottom:-90px;background:linear-gradient(135deg,var(--brand),transparent 70%);opacity:.35;transform:rotate(45deg);transition:transform .5s var(--ease),opacity .3s}
.card:hover{border-color:var(--accent);transform:translateY(-4px)}.card:hover:after{transform:rotate(45deg) scale(1.25);opacity:.6}
.card small,.row small{font:600 13px var(--b);color:var(--accent);letter-spacing:.1em}.card p{margin:12px 0 0;font-size:15px;max-width:380px}.card .top{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:var(--accent)}.card>*{position:relative;z-index:1}
.c1,.c4{grid-column:span 4}.c2,.c3{grid-column:span 2}.c5,.c6{grid-column:span 3}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tiles .card{min-height:230px}.tiles .card:after{display:none}
.sx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-top:32px;color:var(--muted);font-size:13px}
/* league */
.lb{background:radial-gradient(900px 400px at 85% 0,#3a1a52,transparent 70%),var(--deep);border-block:1px solid #4c2562;padding:clamp(64px,9vw,110px) 0 36px}.lg2{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}.lb h2{font-size:clamp(40px,7vw,104px);line-height:.98}.lb p{color:#d6c8e2;font-size:18px}
.circ{display:grid;place-items:center;width:clamp(96px,12vw,170px);aspect-ratio:1;border:1px solid #8f5bb0;border-radius:50%;font-size:clamp(40px,5vw,72px);transition:background .25s,transform .35s var(--ease)}.circ:hover{background:var(--brand);transform:rotate(-12deg)}
.lb .sx{border-top:1px solid #4c2562;padding-top:24px;margin-top:48px}
/* rows */
.rows{margin-top:36px}.row{display:grid;grid-template-columns:56px 1fr 1.1fr;gap:30px;align-items:center;padding:32px 0;border-top:1px solid var(--line);transition:padding .3s var(--ease),background .3s}.row:last-child{border-bottom:1px solid var(--line)}.row p{margin:0;font-size:15px}.row h3{transition:color .2s}
.row:hover{padding-left:14px}.row:hover h3{color:var(--accent)}
.row.l{grid-template-columns:56px 1fr 1.1fr 28px}.row.l>.ar{font-size:28px;color:var(--accent)}
.intro{padding:clamp(48px,8vw,104px) 0 clamp(24px,4vw,48px)}.intro h1{max-width:1100px;margin-bottom:32px}.lead{max-width:720px;font-size:20px}
.disc{font:600 clamp(26px,4.4vw,56px)/1.35 var(--d);letter-spacing:-.03em;padding:24px 0 clamp(48px,7vw,96px)}.disc b{color:var(--accent);font-weight:400;padding:0 .2em}
/* team */
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.pt{position:relative;aspect-ratio:1;display:grid;place-items:center;margin-bottom:22px;font:600 clamp(80px,10vw,140px) var(--d);color:var(--accent);background:linear-gradient(135deg,#34164a,#150d1d);clip-path:polygon(0 0,100% 0,100% 80%,80% 100%,0 100%);overflow:hidden;transition:transform .4s var(--ease)}.pt:after{content:'';position:absolute;width:75%;height:75%;right:-28%;bottom:-28%;border:1px solid #6f3a96;transform:rotate(45deg)}
